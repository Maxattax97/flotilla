---
# MOCULL AUTOGENERATED - will be overwritten by zshrc_setup_repo
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: check-git-crypt
        name: check that git-crypt files are encrypted
        entry: bash -c 'if test -d .git-crypt; then git crypt status -e; fi'
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
      - id: pretty-format-json
        args: [--autofix]
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: forbid-submodules
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/pecigonzalo/pre-commit-shfmt
    rev: v2.2.0
    hooks:
      - id: shell-fmt-docker
        args:
          - -w
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/ansible/ansible-lint
    # put latest release tag from
    # https://github.com/ansible-community/ansible-lint/releases/
    rev: v26.2.0
    hooks:
      - id: ansible-lint
        # The upstream hook otherwise runs for every commit and scans the whole
        # repository, even when no Ansible files were staged.
        always_run: false
        files: (^|/)(playbooks?|roles|tasks|handlers|group_vars|host_vars)/.*\.ya?ml$|(^|/)(site|main)\.ya?ml$
        exclude: ^\.pre-commit-config\.yaml$
        args: [--fix, --format, pep8]
        additional_dependencies:
          - jmespath
