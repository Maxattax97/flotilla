# Actual Budget: actual.maxocull.com -> actual:5006.
# Set the Actual server password through localhost before publishing DNS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name actual.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 100m;

    # Keep these at server scope to preserve the SSL include's security headers.
    # Actual's browser database requires cross-origin isolation.
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app actual;
        set $upstream_port 5006;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
