spark.master spark://spark-master:7077
spark.sql.extensions io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.hadoop.fs.s3a.endpoint http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.driver.host jupyterlab
spark.driver.bindAddress 0.0.0.0
spark.driver.port 39001
spark.blockManager.port 39002
spark.executor.memory 1g
spark.executor.cores 1
spark.cores.max 2
spark.sql.shuffle.partitions 4
spark.redaction.regex (?i)secret|password|token|access[.]?key
spark.jars.packages io.delta:delta-spark_2.12:3.2.1,org.apache.hadoop:hadoop-aws:3.3.4
spark.jars.ivy /home/jovyan/.ivy2
